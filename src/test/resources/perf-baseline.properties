# java-util performance baseline -- best observed ratio per metric.
#
# Each value is subject-nanos / yardstick-nanos, both measured in the same JVM run, so the
# number is portable across machines: 1.85 means "1.85x the cost of the JDK equivalent".
# LOWER IS BETTER and the bar only moves down -- see PerfRatchet.
#
# Lock in a genuine gain (writes only credible improvements -- the ratchet):
#   mvn clean test -DperformRelease=true -Dperf.baseline.update=true
#
# Establish or repair baselines (writes every metric, either direction):
#   mvn clean test -DperformRelease=true -Dperf.baseline.reset=true
#
# Always calibrate from a FULL suite run. Running these classes in isolation gives
# materially different ratios and much lower noise than the release build does.

